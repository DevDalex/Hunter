<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Nen category relationship diagram</title><desc id="desc">The six Nen categories arranged by relative position.</desc><defs><radialGradient id="bg"><stop stop-color="#26344d"/><stop offset="1" stop-color="#090d18"/></radialGradient></defs><rect width="960" height="540" fill="url(#bg)"/><g fill="none" stroke="#d9c276" stroke-width="3" opacity=".55"><line x1="480" y1="270" x2="480" y2="70"/><line x1="480" y1="270" x2="735" y2="180"/><line x1="480" y1="270" x2="735" y2="370"/><line x1="480" y1="270" x2="480" y2="480"/><line x1="480" y1="270" x2="225" y2="370"/><line x1="480" y1="270" x2="225" y2="180"/><path d="M480 70 735 180 735 370 480 480 225 370 225 180Z"/></g><g fill="#111a29" stroke="#e6d188" stroke-width="3"><circle cx="480" cy="70" r="54"/><text x="480" y="75">Enhancement</text><circle cx="735" cy="180" r="54"/><text x="735" y="185">Transmutation</text><circle cx="735" cy="370" r="54"/><text x="735" y="375">Conjuration</text><circle cx="480" cy="480" r="54"/><text x="480" y="485">Specialization</text><circle cx="225" cy="370" r="54"/><text x="225" y="375">Manipulation</text><circle cx="225" cy="180" r="54"/><text x="225" y="185">Emission</text></g><circle cx="480" cy="270" r="68" fill="#101827" stroke="#e6d188" stroke-width="3"/><text x="480" y="282" text-anchor="middle" font-family="Georgia,serif" font-size="42" fill="#f4dfa2">Nen</text><style>text{font-family:Arial,sans-serif;font-size:17px;fill:#f5f1e5;text-anchor:middle}</style></svg>
