name: Succession Visual Redesign Batch 4 Closure

on:
  push:
    branches:
      - 'succession-visual-redesign-batch-4'
  pull_request:
    paths:
      - 'src/components/succession/SuccessionArchiveChapterStoryWorkspace.jsx'
      - 'src/components/succession/SuccessionArchiveChapterCommand.css'
      - 'src/components/succession/SuccessionArchiveStoryIntelligenceWorkspace.jsx'
      - 'src/components/succession/SuccessionArchiveStoryCommand.css'
      - 'src/components/succession/SuccessionArchiveEventWorkspace.jsx'
      - 'src/components/succession/SuccessionArchiveEventCommand.css'
      - 'src/components/succession/SuccessionArchiveNenWorkspace.jsx'
      - 'src/components/succession/SuccessionArchiveNenCommand.css'
      - 'src/components/succession/SuccessionArchiveNenCommandLayout.css'
      - 'src/components/succession/SuccessionArchiveNenCommandDossier.css'
      - 'src/components/succession/SuccessionArchiveGuardianBeastWorkspace.jsx'
      - 'src/components/succession/SuccessionArchiveGuardianBeastCommand.css'
      - 'src/components/succession/SuccessionArchiveGuardianBeastCommandLayout.css'
      - 'src/components/succession/SuccessionArchiveGuardianBeastCommandDossier.css'
      - 'src/components/succession/SuccessionArchiveLocationWorkspace.jsx'
      - 'src/components/succession/SuccessionArchiveLocationCommand.css'
      - 'src/components/succession/SuccessionArchiveBlackWhaleCommand.css'
      - 'src/components/succession/SuccessionArchiveSearch.css'
      - 'src/components/BlackWhaleGuide.jsx'
      - 'scripts/audit-succession-batch-4-*.mjs'
      - 'docs/SUCCESSION-VISUAL-REDESIGN-BATCH-4*.md'
      - 'src/data/routeManifest.js'
      - '.github/workflows/succession-visual-redesign-batch-4-closure.yml'

permissions:
  contents: read

concurrency:
  group: succession-visual-redesign-batch-4-closure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  batch_4_closure:
    name: Batch 4 complete story and reference regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 95

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit Batch 4 chapter intelligence
        run: node scripts/audit-succession-batch-4-chapters.mjs

      - name: Audit Batch 4 Story intelligence
        run: node scripts/audit-succession-batch-4-story.mjs

      - name: Audit Batch 4 event intelligence
        run: node scripts/audit-succession-batch-4-events.mjs

      - name: Audit Batch 4 Nen mechanics
        run: node scripts/audit-succession-batch-4-nen-release.mjs

      - name: Audit Batch 4 Guardian Spirit Beasts
        run: node scripts/audit-succession-batch-4-guardian-beasts.mjs

      - name: Audit Batch 4 spatial closure
        run: node scripts/audit-succession-batch-4-spatial.mjs

      - name: Audit visual foundation
        run: npm run audit:succession-visual-foundation

      - name: Audit shared shell redesign
        run: npm run audit:succession-shell-redesign

      - name: Audit page-header redesign
        run: npm run audit:succession-page-header-redesign

      - name: Audit breadcrumb redesign
        run: npm run audit:succession-breadcrumb-redesign

      - name: Audit Batch 2 closure
        run: npm run audit:succession-batch-2

      - name: Audit Batch 3 character command
        run: npm run audit:succession-character-command

      - name: Audit Batch 3 royal command
        run: npm run audit:succession-royal-command

      - name: Audit Batch 3 closure
        run: npm run audit:succession-batch-3

      - name: Audit CSS ownership
        run: npm run audit:css

      - name: Audit readability
        run: npm run audit:readability

      - name: Audit accessibility contracts
        run: npm run audit:accessibility

      - name: Build presentation bundle
        run: |
          npm run prepare:eta-assets
          npx vite build

      - name: Install Chromium for visual QA
        shell: bash
        run: |
          npx playwright install --with-deps chromium
          echo "CHROMIUM_PATH=$(node -e "import('playwright').then(({ chromium }) => console.log(chromium.executablePath()))")" >> "$GITHUB_ENV"

      - name: Inspect Chapters at all viewports
        env: { VISUAL_QA_ROUTE: succession/chapters, VISUAL_QA_OUTPUT: .visual-qa/succession-chapters, VISUAL_QA_SCREENSHOTS: all }
        run: npm run qa:visual 2>&1 | tee batch4-chapters-visual.log

      - name: Inspect Story at all viewports
        env: { VISUAL_QA_ROUTE: succession/story, VISUAL_QA_OUTPUT: .visual-qa/succession-story, VISUAL_QA_SCREENSHOTS: all }
        run: npm run qa:visual 2>&1 | tee batch4-story-visual.log

      - name: Inspect Events at all viewports
        env: { VISUAL_QA_ROUTE: succession/events, VISUAL_QA_OUTPUT: .visual-qa/succession-events, VISUAL_QA_SCREENSHOTS: all }
        run: npm run qa:visual 2>&1 | tee batch4-events-visual.log

      - name: Inspect Nen at all viewports
        env: { VISUAL_QA_ROUTE: succession/nen, VISUAL_QA_OUTPUT: .visual-qa/succession-nen, VISUAL_QA_SCREENSHOTS: all }
        run: npm run qa:visual 2>&1 | tee batch4-nen-visual.log

      - name: Inspect Guardian Spirit Beasts at all viewports
        env: { VISUAL_QA_ROUTE: succession/guardian-spirit-beasts, VISUAL_QA_OUTPUT: .visual-qa/succession-guardian-beasts, VISUAL_QA_SCREENSHOTS: all }
        run: npm run qa:visual 2>&1 | tee batch4-guardian-beasts-visual.log

      - name: Inspect Locations at all viewports
        env: { VISUAL_QA_ROUTE: succession/locations, VISUAL_QA_OUTPUT: .visual-qa/succession-locations, VISUAL_QA_SCREENSHOTS: all }
        run: npm run qa:visual 2>&1 | tee batch4-locations-visual.log

      - name: Inspect Black Whale at all viewports
        env: { VISUAL_QA_ROUTE: succession/black-whale, VISUAL_QA_OUTPUT: .visual-qa/succession-black-whale, VISUAL_QA_SCREENSHOTS: all }
        run: npm run qa:visual 2>&1 | tee batch4-black-whale-visual.log

      - name: Publish Batch 4 closure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: succession-batch-4-closure-diagnostics
          path: |
            batch4-*-visual.log
            .visual-qa/succession-chapters
            .visual-qa/succession-story
            .visual-qa/succession-events
            .visual-qa/succession-nen
            .visual-qa/succession-guardian-beasts
            .visual-qa/succession-locations
            .visual-qa/succession-black-whale
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
