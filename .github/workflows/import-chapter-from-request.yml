name: Import chapter from request

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: chapter-import
  cancel-in-progress: false

jobs:
  import:
    if: github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '[Chapter Import]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Parse import request
        id: request
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const body = process.env.ISSUE_BODY || '';
          const read = (name) => body.match(new RegExp(`^${name}=(.*)$`, 'm'))?.[1]?.trim() || '';
          if (!body.includes('HUNTER_CHAPTER_IMPORT_REQUEST_V2')) {
            throw new Error('The issue does not contain a version 2 Hunter chapter import request.');
          }
          const sourceUrl = read('source_url');
          const chapter = Number.parseInt(read('chapter'), 10);
          const replace = read('replace') === 'true';
          const selectedBlock = body.match(/^selected_images_begin\s*\r?\n([\s\S]*?)^selected_images_end\s*$/m)?.[1] || '';
          const selectedImages = selectedBlock
            .split(/\r?\n/)
            .map((value) => value.trim())
            .filter(Boolean);

          let parsed;
          try { parsed = new URL(sourceUrl); } catch { throw new Error('The import request contains an invalid source_url.'); }
          if (!['http:', 'https:'].includes(parsed.protocol)) throw new Error('The source URL must use HTTP or HTTPS.');
          if (!Number.isInteger(chapter) || chapter < 338 || chapter > 414) throw new Error('Chapter must be from 338 through 414.');
          if (selectedImages.length < 1 || selectedImages.length > 120) throw new Error('The request must contain 1 through 120 selected image URLs.');

          const normalized = selectedImages.map((value, index) => {
            let url;
            try { url = new URL(value); } catch { throw new Error(`Selected image URL ${index + 1} is invalid.`); }
            if (!['http:', 'https:'].includes(url.protocol)) throw new Error(`Selected image URL ${index + 1} must use HTTP or HTTPS.`);
            return url.href;
          });
          if (new Set(normalized).size !== normalized.length) throw new Error('The selected image list contains duplicate URLs.');

          fs.writeFileSync('.chapter-import-selected-images.json', `${JSON.stringify(normalized, null, 2)}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `source_url<<EOF\n${sourceUrl}\nEOF\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `chapter=${chapter}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `replace=${replace}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `selected_count=${normalized.length}\n`);
          NODE

      - name: Import selected chapter pages
        env:
          SOURCE_URL: ${{ steps.request.outputs.source_url }}
          CHAPTER: ${{ steps.request.outputs.chapter }}
          REPLACE: ${{ steps.request.outputs.replace }}
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          path = Path('scripts/lib/succession-chapter-url-source.mjs')
          source = path.read_text()
          source = source.replace(
              "const USER_AGENT = 'Hunter-Archive-Chapter-Importer/1.0 (+local maintainer tool)';",
              "const USER_AGENT = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36';",
          )
          path.write_text(source)
          PY
          args=("$SOURCE_URL" "$CHAPTER" --confirm --image-list-file .chapter-import-selected-images.json)
          if [[ "$REPLACE" == "true" ]]; then args+=(--replace); fi
          node scripts/import-succession-chapter-url.mjs "${args[@]}"
          rm -f .chapter-import-selected-images.json
          node scripts/audit-succession-chapter-media.mjs

      - name: Commit imported chapter
        env:
          CHAPTER: ${{ steps.request.outputs.chapter }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "public/media/succession-contest/chapters/$CHAPTER" src/data/successionChapterMedia.generated.js
          git diff --cached --quiet && { echo "No repository changes were produced."; exit 1; }
          git commit -m "Import Succession Chapter $CHAPTER selected pages"
          git push origin HEAD:main

      - name: Mark request complete
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          CHAPTER: ${{ steps.request.outputs.chapter }}
          SELECTED_COUNT: ${{ steps.request.outputs.selected_count }}
        run: |
          gh issue comment "$ISSUE" --body "Chapter $CHAPTER was imported with the requested $SELECTED_COUNT selected pictures, committed to main, and queued for deployment."
          gh issue close "$ISSUE" --reason completed

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE" --body "The selected-picture chapter import failed. Open the failed GitHub Actions run attached to this issue for the exact detection, download or validation error."
