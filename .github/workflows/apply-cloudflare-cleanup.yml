name: Apply Cloudflare HxH cleanup

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'refactor/02-cloudflare-hxh-only' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/02-cloudflare-hxh-only

      - name: Apply verified cleanup
        shell: bash
        run: |
          set -euo pipefail
          cat .refactor/cloudflare-cleanup-00.b64 .refactor/cloudflare-cleanup-01.b64 .refactor/cloudflare-cleanup-02.b64 .refactor/cloudflare-rem00-*.b64 .refactor/cloudflare-rem-0[1-7].b64 > /tmp/cleanup.b64
          echo 'be8bc479302caeb7603927a2c82a4335c9e5c918825573fd9385f6d86652cd55  /tmp/cleanup.b64' | sha256sum --check
          base64 --decode /tmp/cleanup.b64 | gzip --decompress > /tmp/cleanup.patch
          echo 'fc53847d0ac763828ae0aed5b896de59adc0b14bbed9fb53efd219ee83336936  /tmp/cleanup.patch' | sha256sum --check
          git apply --check /tmp/cleanup.patch
          git apply /tmp/cleanup.patch
          git checkout HEAD -- .github/workflows/sites-fullstack-build.yml
          rm -f .github/workflows/cloudflare-build.yml

      - name: Commit and push application cleanup
        shell: bash
        run: |
          set -euxo pipefail
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove obsolete Sites and portable packaging systems'
          git push origin HEAD:refactor/02-cloudflare-hxh-only
