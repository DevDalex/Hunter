name: One-time Chapter 398 pre-boundary leak repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chapter-398-preboundary-leak-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out Chapter 398 Nen correction only
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            src/data/succession/nenSystemFoundation398Corrections.js
          sparse-checkout-cone-mode: false

      - name: Remove future-specific Biohazard vocabulary from pre-398 slices
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/data/succession/nenSystemFoundation398Corrections.js')
          content = path.read_text()

          replacements = {
            "'No Chapter 398 transmitter-oyster mechanics are available yet.'": "'No additional Biohazard mechanic is established by Chapter 393.'",
            "'From Chapters 395 through 397, the latest available Biohazard mechanic remains Chapter 394’s recovery of the transformed surveillance cat back into its camcorder form with recorded footage intact. The later transmitter-oyster, size-dependent duration, aura-depletion reversion statement, and receiver specifications are not yet available.'": "'From Chapters 395 through 397, the latest available Biohazard mechanic remains Chapter 394’s recovery of the transformed surveillance cat back into its camcorder form with recorded footage intact. No additional Biohazard mechanic is established within Chapters 395–397.'",
            "'No maximum duration, universal reversion rule, size-to-duration relation, transmitter application, or one-kilometer receiver mechanic is known before Chapter 398.'": "'Duration, resource consumption, operating range, and complete transformation limits remain unresolved at this boundary.'",
          }
          for old, new in replacements.items():
              if old not in content:
                  raise SystemExit(f'Expected pre-398 Biohazard text not found: {old}')
              content = content.replace(old, new, 1)

          path.write_text(content)

      - name: Commit pre-boundary leak repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/succession/nenSystemFoundation398Corrections.js
          git commit -m 'Quarantine Chapter 398 Biohazard vocabulary'
          git push origin HEAD:main
