name: Automatic chapter import batch
run-name: Automatic chapter batch · ${{ github.run_number }}

on:
  push:
    branches: [main]
    paths:
      - .github/chapter-import-batch.json
      - .github/workflows/import-chapter-batch.yml
      - scripts/run-succession-chapter-batch.mjs
  repository_dispatch:
    types: [hunter-chapter-batch-continue]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chapter-import
  cancel-in-progress: false

jobs:
  import-batch:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Import next chapter batch
        id: batch
        shell: bash
        run: |
          set -euo pipefail
          helper='scripts/lib/succession-chapter-url-source.mjs'
          backup="$RUNNER_TEMP/succession-chapter-url-source.mjs"
          cp "$helper" "$backup"
          restore_helper() { cp "$backup" "$helper"; }
          trap restore_helper EXIT

          python <<'PY'
          from pathlib import Path
          path = Path('scripts/lib/succession-chapter-url-source.mjs')
          source = path.read_text()
          source = source.replace(
              "const USER_AGENT = 'Hunter-Archive-Chapter-Importer/1.0 (+local maintainer tool)';",
              "const USER_AGENT = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36';",
          )
          path.write_text(source)
          PY

          node scripts/run-succession-chapter-batch.mjs
          restore_helper
          trap - EXIT
          node scripts/audit-succession-chapter-media.mjs

      - name: Commit batch progress
        shell: bash
        env:
          SELECTED: ${{ steps.batch.outputs.selected }}
          SUCCEEDED: ${{ steps.batch.outputs.succeeded }}
          RETRIED: ${{ steps.batch.outputs.retried }}
          NEWLY_FAILED: ${{ steps.batch.outputs.newly_failed }}
          REMAINING: ${{ steps.batch.outputs.remaining }}
          FAILED_TOTAL: ${{ steps.batch.outputs.failed_total }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/chapter-import-batch.json src/data/successionChapterMedia.generated.js src/data/successionChapterAvailability.generated.js public/media/succession-contest/chapters

          if git diff --cached --quiet; then
            echo "No batch changes were produced."
          else
            label="${SUCCEEDED:-no-successes}"
            git commit -m "Automatic Succession chapter batch: $label"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

          {
            echo "## Automatic chapter batch"
            echo "- Selected: ${SELECTED:-none}"
            echo "- Imported: ${SUCCEEDED:-none}"
            echo "- Retrying: ${RETRIED:-none}"
            echo "- Newly failed: ${NEWLY_FAILED:-none}"
            echo "- Remaining: ${REMAINING:-0}"
            echo "- Total manual-review failures: ${FAILED_TOTAL:-0}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Queue next batch
        if: steps.batch.outputs.continue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/dispatches" \
            -d '{"event_type":"hunter-chapter-batch-continue","client_payload":{"previous_run":"${{ github.run_id }}"}}'
