name: Succession Phase 6 Consolidation

on:
  pull_request:
    paths:
      - 'src/data/succession/successionData.js'
      - 'src/data/succession/releaseManifest.js'
      - 'src/data/succession/productClosureSelectorsRelease.js'
      - 'src/data/succession/productClosureSelectorsPhase4.js'
      - 'src/data/succession/workspaceRefinementRuntime.js'
      - 'src/components/succession/SuccessionArchiveEntry.jsx'
      - 'src/components/succession/SuccessionReleaseDesktop.css'
      - 'src/components/succession/SuccessionInformationConsistencyPanel.css'
      - 'src/components/succession/SuccessionPhase4DesktopOnly.css'
      - 'src/components/succession/SuccessionWorkspaceRefinementDeck.css'
      - 'scripts/audit-succession-phase-6-consolidation.mjs'
      - 'scripts/succession-phase-6-release-qa.mjs'
      - 'scripts/run-succession-runtime-audits.mjs'
      - '.github/workflows/succession-phase-6-consolidation.yml'
  workflow_dispatch:

concurrency:
  group: succession-phase-6-consolidation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  phase-6-consolidation:
    name: Phase 6 canonical runtime and desktop release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Phase 6 consolidation audit
        run: node scripts/audit-succession-phase-6-consolidation.mjs

      - name: Run complete Succession runtime audit sweep
        run: node scripts/run-succession-runtime-audits.mjs

      - name: Build presentation runtime
        run: npm run build:runtime

      - name: Install Chromium
        run: npm exec playwright -- install --with-deps chromium

      - name: Inspect consolidated desktop release surfaces
        run: node scripts/succession-phase-6-release-qa.mjs

      - name: Publish Phase 6 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: succession-phase-6-release-diagnostics
          path: .visual-qa/succession-phase-6-release
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
