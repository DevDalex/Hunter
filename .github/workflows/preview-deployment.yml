name: Preview Deployment

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: preview-deployment-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  preview:
    name: Build, upload, and smoke-test preview
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build release artifact
        run: npm run build

      - name: Report missing preview credentials
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo '### Preview Deployment' >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo 'Preview upload was skipped because `CLOUDFLARE_API_TOKEN` or `CLOUDFLARE_ACCOUNT_ID` is not configured as a repository secret.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload non-production Worker version
        id: upload
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        shell: bash
        run: |
          set -o pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            alias="pr-${{ github.event.pull_request.number }}"
          else
            alias="manual-${GITHUB_RUN_ID}"
          fi

          npx wrangler versions upload --preview-alias "$alias" 2>&1 | tee preview-upload.log
          preview_url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' preview-upload.log | tail -1)"
          if [[ -z "$preview_url" ]]; then
            echo 'Wrangler did not report a preview URL.' >&2
            exit 1
          fi

          echo "url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "alias=$alias" >> "$GITHUB_OUTPUT"

      - name: Smoke-test preview deployment
        if: steps.upload.outputs.url != ''
        env:
          DEPLOYMENT_URL: ${{ steps.upload.outputs.url }}
        run: node scripts/smoke-deployment.mjs "$DEPLOYMENT_URL"

      - name: Publish preview summary
        if: steps.upload.outputs.url != ''
        run: |
          echo '### Preview Deployment' >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: ${{ steps.upload.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Alias: ${{ steps.upload.outputs.alias }}" >> "$GITHUB_STEP_SUMMARY"
          echo '- Smoke test: **passed**' >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on pull request
        if: github.event_name == 'pull_request' && steps.upload.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
        shell: bash
        run: |
          body="### Preview Deployment

          Preview: ${PREVIEW_URL}

          The production artifact, build identity, and generated Chimera Ant AVIF passed the deployment smoke test."

          comment_id="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments" --paginate --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("### Preview Deployment")))] | first | .id // empty')"
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -f body="$body" >/dev/null
          else
            gh pr comment "${{ github.event.pull_request.number }}" --body "$body"
          fi

      - name: Upload preview diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-deployment-${{ github.sha }}
          path: preview-upload.log
          if-no-files-found: ignore
          retention-days: 7
