name: One-time Chapter 398 markdown audit repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chapter-398-markdown-audit-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out Chapter 398 audit only
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts/audit-succession-chapter-398-boundary.mjs
          sparse-checkout-cone-mode: false

      - name: Ignore Markdown emphasis in Morena source-note assertion
        shell: python
        run: |
          from pathlib import Path
          path = Path('scripts/audit-succession-chapter-398-boundary.mjs')
          content = path.read_text()
          old = "assert(/does not prove Morena personally operates|does not.*Morena.*personally operates/i.test(note), 'source note must preserve Morena-operator uncertainty');"
          new = "assert(/does not prove Morena personally operates|does not.*Morena.*personally operates/i.test(note.replaceAll('**', '')), 'source note must preserve Morena-operator uncertainty');"
          if old not in content:
              raise SystemExit('Expected Morena source-note assertion not found')
          path.write_text(content.replace(old, new, 1))

      - name: Commit Markdown audit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/audit-succession-chapter-398-boundary.mjs
          git commit -m 'Handle Markdown in Chapter 398 source-note audit'
          git push origin HEAD:main
