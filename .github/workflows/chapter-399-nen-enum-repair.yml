name: One-time Chapter 399 Nen enum repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chapter-399-nen-enum-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out Chapter 399 enum targets
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            src/data/succession/abilityFoundation399Expansion.js
            scripts/audit-succession-chapter-399-boundary.mjs
          sparse-checkout-cone-mode: false

      - name: Repair canonical Nen enum casing
        shell: python
        run: |
          from pathlib import Path

          ability = Path('src/data/succession/abilityFoundation399Expansion.js')
          text = ability.read_text()
          replacements = {
              "nenTypes: freeze(['Emission'])": "nenTypes: freeze(['emission'])",
              "nenTypes: freeze(['Conjuration'])": "nenTypes: freeze(['conjuration'])",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing ability enum marker: {old}')
              text = text.replace(old, new, 1)
          ability.write_text(text)

          audit = Path('scripts/audit-succession-chapter-399-boundary.mjs')
          text = audit.read_text()
          replacements = {
              ".includes('Emission')": ".includes('emission')",
              ".includes('Conjuration')": ".includes('conjuration')",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing audit enum marker: {old}')
              text = text.replace(old, new, 1)
          audit.write_text(text)

      - name: Commit enum repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/succession/abilityFoundation399Expansion.js scripts/audit-succession-chapter-399-boundary.mjs
          git commit -m 'Use canonical Nen enums for Chapter 399 abilities'
          git push origin HEAD:main
