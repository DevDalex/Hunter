name: Succession 339-418 Visibility Audit

on:
  workflow_dispatch:

concurrency:
  group: succession-visibility-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-visibility:
    name: Legacy exact data-to-route reachability
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit preserved Chapter 339-418 route reachability
        run: npm run audit:succession-visibility

      - name: Upload exact visibility ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: succession-339-418-visibility-ledger
          path: .succession-339-418-visibility-audit
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Explain scope
        if: always()
        run: echo 'This is a manual historical route-reachability suite. It is not part of the homepage production release gate.' >> "$GITHUB_STEP_SUMMARY"

  rendered-visibility:
    name: Legacy rendered archive-route visibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website runtime
        run: npx vite build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify preserved Chapter 339-418 archive-route visibility
        run: node scripts/succession-339-418-visibility-qa.mjs

      - name: Upload rendered visibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: succession-339-418-rendered-visibility
          path: .succession-339-418-visibility-qa
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Explain scope
        if: always()
        run: echo 'This is a manual historical rendered-route suite. It is not part of the homepage production release gate.' >> "$GITHUB_STEP_SUMMARY"
