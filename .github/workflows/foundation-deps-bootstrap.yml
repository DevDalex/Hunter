name: Foundation dependencies bootstrap

on:
  push:
    branches:
      - foundation/design-engineering-lab
    paths:
      - .github/workflows/foundation-deps-bootstrap.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: foundation/design-engineering-lab

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Add runtime design-engineering foundations
        run: >-
          npm install --save-exact
          @base-ui/react@1.7.0
          @gsap/react@2.1.2
          graphology@0.26.0
          gsap@3.15.0
          minisearch@7.2.0
          motion@13.1.1
          zod@4.4.3

      - name: Add Storybook workshop
        run: >-
          npm install --save-dev --save-exact
          storybook@10.5.10
          @storybook/react-vite@10.5.10
          @storybook/addon-a11y@10.5.10
          @storybook/addon-docs@10.5.10

      - name: Commit generated package metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No package metadata changes to commit."
          else
            git commit -m "chore: add design engineering foundations"
            git push origin HEAD:foundation/design-engineering-lab
          fi
