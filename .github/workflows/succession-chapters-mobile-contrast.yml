name: Succession Chapters Mobile Contrast

on:
  pull_request:
    paths:
      - '.github/workflows/succession-chapters-mobile-contrast.yml'
      - 'src/components/succession/SuccessionArchiveChapterStoryWorkspace.jsx'
      - 'src/components/succession/SuccessionArchiveChapterCommand.css'
      - 'src/components/succession/SuccessionExactContrastClosure.css'
      - 'src/components/succession/SuccessionFinalContrastClosure.css'
      - 'src/components/succession/SuccessionFinalReleasePatch.css'
      - 'scripts/accessibility-qa.mjs'
      - 'src/data/routeManifest.js'

permissions:
  contents: read

concurrency:
  group: succession-chapters-mobile-contrast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile_chapters_contrast:
    name: Mobile Chapters exact contrast gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out focused presentation source
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            index.html
            package.json
            package-lock.json
            vite.config.js
            src
            scripts/accessibility-qa.mjs
          sparse-checkout-cone-mode: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build presentation bundle
        run: npx vite build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run exact mobile Chapters contrast probe
        shell: bash
        env:
          ACCESSIBILITY_QA_ROUTE: succession/chapters
          ACCESSIBILITY_QA_VIEWPORT: mobile
          ACCESSIBILITY_QA_OUTPUT: .chapters-mobile-contrast
          PLAYWRIGHT_CORE_PATH: playwright
        run: |
          set -o pipefail
          export CHROMIUM_PATH="$(node -e "import('playwright').then(({ chromium }) => console.log(chromium.executablePath()))")"
          npm run qa:accessibility
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const report = JSON.parse(await readFile('.chapters-mobile-contrast/report.json', 'utf8'));
          const warnings = report.routes.flatMap((route) => route.contrastWarnings || []);
          const nodes = warnings.flatMap((warning) => warning.nodes.map((node) => ({
            id: warning.id,
            impact: warning.impact,
            target: node.target,
            html: node.html,
            failureSummary: node.failureSummary,
          })));
          if (nodes.length) {
            console.error('Mobile Chapters contrast targets:');
            for (const node of nodes) console.error(JSON.stringify(node));
            process.exitCode = 1;
          } else {
            console.log('Mobile Chapters contrast probe passed: 0 axe color-contrast nodes.');
          }
          NODE

      - name: Upload contrast report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: succession-chapters-mobile-contrast
          path: .chapters-mobile-contrast
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
