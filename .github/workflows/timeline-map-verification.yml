name: Timeline Map Verification

on:
  workflow_dispatch:

concurrency:
  group: timeline-map-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  timeline-map:
    name: Legacy Timeline Map production browser gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify preserved Timeline map contracts
        run: node --test tests/timelinePrimaryMap.test.mjs tests/timelineMapLensData.test.mjs

      - name: Build production runtime
        run: npm run build:runtime

      - name: Install Chromium
        run: npm exec playwright -- install --with-deps chromium

      - name: Exercise preserved Timeline map
        run: npm run qa:timeline-map

      - name: Publish Timeline map diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timeline-map-qa-${{ github.sha }}
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
          path: .timeline-map-qa/

      - name: Explain scope
        if: always()
        run: echo 'This is a manual historical Timeline regression suite. It is not part of the homepage production release gate.' >> "$GITHUB_STEP_SUMMARY"
