name: Finalize future chapter import support

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-future-chapter-import.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove the remaining Chapter 414 ceilings
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          replacements = {
              Path('server/chapter-admin.js'): [
                  ('const READER_END = 414;', 'const READER_END = 9999;'),
              ],
              Path('public/admin/chapters/direct.html'): [
                  ('max="414"', 'max="9999"'),
              ],
              Path('public/admin/chapters/index.html'): [
                  ('max="414"', 'max="9999"'),
              ],
              Path('scripts/import-succession-chapter-url.mjs'): [
                  ('const READER_END = 414;', 'const READER_END = 9999;'),
              ],
              Path('scripts/import-succession-chapter.mjs'): [
                  ('const READER_END = 414;', 'const READER_END = 9999;'),
              ],
          }

          for path, pairs in replacements.items():
              if not path.exists():
                  continue
              source = path.read_text()
              updated = source
              for old, new in pairs:
                  updated = updated.replace(old, new)
              if updated != source:
                  path.write_text(updated)

          worker = Path('server/chapter-admin.js').read_text()
          if 'const READER_END = 9999;' not in worker:
              raise SystemExit('Worker chapter ceiling was not updated.')

          Path('.github/workflows/finalize-future-chapter-import.yml').unlink()
          PY

      - name: Commit the synchronized importer limits
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes were required."; exit 0; }
          git commit -m "Remove hard-coded Chapter 414 import ceiling"
          git pull --rebase origin main
          git push origin HEAD:main
