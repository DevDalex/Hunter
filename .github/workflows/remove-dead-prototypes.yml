name: Remove dead prototypes

on:
  push:
    branches: [chimera-ant-retransform]
    paths: [.github/workflows/remove-dead-prototypes.yml]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: chimera-ant-retransform
          fetch-depth: 0

      - name: Remove superseded prototype stacks and this workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git rm --ignore-unmatch \
            src/components/ChimeraAntPrototypePage.jsx \
            src/components/ChimeraAntPrototypePage.css \
            src/data/chimeraAntPrototype.js \
            src/components/EarlyArcPrototypePage.jsx \
            src/components/EarlyArcPrototypePage.css \
            src/data/earlyArcPrototypes.js \
            src/components/GreedIslandPrototypePage.jsx \
            src/components/GreedIslandPrototypePage.css \
            src/data/greedIslandPrototype.js \
            src/components/YorknewPrototypePage.jsx \
            src/components/YorknewPrototypePage.css \
            src/data/yorknewPrototype.js \
            .github/workflows/remove-dead-prototypes.yml

          git commit -m 'Remove superseded arc prototype stacks'
          git pull --rebase origin chimera-ant-retransform
          git push origin HEAD:chimera-ant-retransform
