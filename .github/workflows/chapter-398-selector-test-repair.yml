name: One-time Chapter 398 selector test repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chapter-398-selector-test-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out Chapter 398 audit only
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts/audit-succession-chapter-398-boundary.mjs
          sparse-checkout-cone-mode: false

      - name: Scope Biohazard assertions to bounded selector fields
        shell: python
        run: |
          from pathlib import Path
          path = Path('scripts/audit-succession-chapter-398-boundary.mjs')
          content = path.read_text()
          content = content.replace('text(bio397.knowledge)', 'text({ summary: bio397.summary, mechanics: bio397.mechanics })')
          content = content.replace('text(bio398.knowledge)', 'text({ summary: bio398.summary, mechanics: bio398.mechanics })')
          if '.knowledge)' in content:
              raise SystemExit('Unexpected stale .knowledge selector assertion remains')
          path.write_text(content)

      - name: Commit selector test repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/audit-succession-chapter-398-boundary.mjs
          git commit -m 'Fix Chapter 398 bounded Biohazard audit'
          git push origin HEAD:main
