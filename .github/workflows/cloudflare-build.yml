name: Cloudflare build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify production build
        run: npm run verify
      - name: Upload production artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hunter-cloudflare-dist-${{ github.sha }}
          path: dist
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
