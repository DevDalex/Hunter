name: Succession Content Depth

on:
  pull_request:
    paths:
      - 'src/data/succession/**'
      - 'src/components/succession/**'
      - 'src/components/NenEncyclopedia.jsx'
      - 'scripts/audit-succession-content-depth-*.mjs'
      - '.github/workflows/succession-content-depth.yml'
  push:
    branches:
      - 'agent/succession-content-depth'
    paths:
      - 'src/data/succession/**'
      - 'src/components/succession/**'
      - 'src/components/NenEncyclopedia.jsx'
      - 'scripts/audit-succession-content-depth-*.mjs'
      - '.github/workflows/succession-content-depth.yml'

permissions:
  contents: read

jobs:
  content-depth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit Succession content depth P0
        run: node scripts/audit-succession-content-depth-p0.mjs

      - name: Audit strategic content depth
        run: node scripts/audit-succession-content-depth-strategic.mjs

      - name: Audit reading depth and evidence integrity
        run: node scripts/audit-succession-content-depth-reading.mjs

      - name: Audit analytical finishing layer
        run: node scripts/audit-succession-content-depth-finishing.mjs

      - name: Audit roadmap completion
        run: node scripts/audit-succession-content-depth-completion.mjs

      - name: Audit 100 percent content completion contract
        run: node scripts/audit-succession-content-depth-100.mjs

      - name: Audit user-facing completion surfaces
        run: node scripts/audit-succession-content-depth-user-surfaces.mjs

      - name: Production build
        run: npm run build
