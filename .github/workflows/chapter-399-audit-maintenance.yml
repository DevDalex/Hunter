name: One-time Chapter 399 audit maintenance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chapter-399-audit-maintenance.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out affected boundary audits
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts/audit-succession-chapter-389-boundary.mjs
            scripts/audit-succession-chapter-391-boundary.mjs
            scripts/audit-succession-chapter-392-boundary.mjs
            scripts/audit-succession-chapter-393-boundary.mjs
            scripts/audit-succession-chapter-394-boundary.mjs
            scripts/audit-succession-chapter-395-boundary.mjs
            scripts/audit-succession-chapter-396-boundary.mjs
            scripts/audit-succession-chapter-397-boundary.mjs
            scripts/audit-succession-chapter-398-boundary.mjs
            scripts/audit-succession-chapter-399-boundary.mjs
          sparse-checkout-cone-mode: false

      - name: Advance publication handoffs and fix live-entity assertions
        shell: python
        run: |
          from pathlib import Path

          chronology_paths = [
              Path('scripts/audit-succession-chapter-389-boundary.mjs'),
              Path('scripts/audit-succession-chapter-391-boundary.mjs'),
              Path('scripts/audit-succession-chapter-392-boundary.mjs'),
              Path('scripts/audit-succession-chapter-393-boundary.mjs'),
              Path('scripts/audit-succession-chapter-394-boundary.mjs'),
              Path('scripts/audit-succession-chapter-395-boundary.mjs'),
              Path('scripts/audit-succession-chapter-396-boundary.mjs'),
              Path('scripts/audit-succession-chapter-397-boundary.mjs'),
          ]
          old_handoff = "numbers[numbers.indexOf(398) + 1] === 400"
          new_handoff = "numbers[numbers.indexOf(398) + 1] === 399 && numbers[numbers.indexOf(399) + 1] === 400"
          for path in chronology_paths:
              text = path.read_text()
              if text.count(old_handoff) != 1:
                  raise SystemExit(f'Expected exactly one 398→400 handoff in {path}; found {text.count(old_handoff)}')
              path.write_text(text.replace(old_handoff, new_handoff, 1))

          path398 = Path('scripts/audit-succession-chapter-398-boundary.mjs')
          text398 = path398.read_text()
          old398 = "assert(trap?.firstChapter === 398 && trap?.latestChapter === 398, 'descriptive front-door trap ability must enter at Chapter 398');"
          new398 = "assert(trap?.firstChapter === 398 && trap?.latestChapter >= 398, 'descriptive front-door trap ability must enter at Chapter 398 even when later chapters extend the live entity');"
          if old398 not in text398:
              raise SystemExit('Chapter 398 live trap assertion marker missing')
          path398.write_text(text398.replace(old398, new398, 1))

          path399 = Path('scripts/audit-succession-chapter-399-boundary.mjs')
          text399 = path399.read_text()
          old399 = "assert(!/operates the teleport|owner of.*teleport|operates.*self-restoring/i.test(text(morena399)), 'Morena must not be assigned ownership of the spatial/restorative mechanisms');"
          new399 = "assert(/does not make her the owner.*Room 3101 teleport route.*self-restoring stage/i.test(text(morena399)), 'Morena state must explicitly preserve non-ownership of the spatial/restorative mechanisms');"
          if old399 not in text399:
              raise SystemExit('Chapter 399 Morena non-ownership assertion marker missing')
          path399.write_text(text399.replace(old399, new399, 1))

      - name: Commit audit maintenance
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts
          git commit -m 'Advance boundary audits through Chapter 399'
          git push origin HEAD:main
