name: One-time Chapter 399 final recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chapter-399-final-recovery.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out recovery targets
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts/audit-succession-chapter-398-boundary.mjs
            src/data/succession/characterState399Corrections.js
          sparse-checkout-cone-mode: false

      - name: Restore proven Chapter 398 audit and patch Biohazard live-entity assertion
        shell: bash
        run: |
          git fetch origin f001fc36a8d775b819fe80b3b00310975a168916 --depth=1
          git checkout FETCH_HEAD -- scripts/audit-succession-chapter-398-boundary.mjs
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/audit-succession-chapter-398-boundary.mjs')
          content = path.read_text()
          old = "assert(bioEntity?.latestChapter === 398, 'current Biohazard entity must advance through Chapter 398');"
          new = "assert(bioEntity?.latestChapter >= 398, 'current Biohazard entity must include Chapter 398 even when later chapters extend the live entity');"
          if old not in content:
              raise SystemExit('Missing Chapter 398 Biohazard recovery marker')
          path.write_text(content.replace(old, new, 1))
          PY

      - name: Preserve Hinrigh knife exhaustion in Chapter 399 state
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/data/succession/characterState399Corrections.js')
          content = path.read_text()
          old = "operationalState: 'Continues the hideout sweep with Nobunaga, confronts nine Heil-Ly members, tests Terebellum with thrown knives, observes Sweet Home and LSDF, retreats from Yokotani’s automatic guards, vomits and hides the still-transformed transmitter-oyster beneath a laundry-room cabinet, then returns to Room 3101 and divides the next Heil-Ly search work with Nobunaga.',"
          new = "operationalState: 'Continues the hideout sweep with Nobunaga, confronts nine Heil-Ly members, tests Terebellum with thrown knives, observes Sweet Home and LSDF, retreats from Yokotani’s automatic guards, vomits and hides the still-transformed transmitter-oyster beneath a laundry-room cabinet, then returns to Room 3101 with his carried knife supply exhausted and divides the next Heil-Ly search work with Nobunaga.',"
          if old not in content:
              raise SystemExit('Expected Hinrigh Chapter 399 operational-state marker not found')
          path.write_text(content.replace(old, new, 1))

      - name: Commit final recovery
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/audit-succession-chapter-398-boundary.mjs src/data/succession/characterState399Corrections.js
          git commit -m 'Restore Chapter 398 audit and complete Hinrigh 399 resource state'
          git push origin HEAD:main
