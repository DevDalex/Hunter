name: Succession Visual Redesign Batch 5

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: succession-visual-redesign-batch-5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  legacy-batch-5:
    name: Legacy Batch 5 regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run preserved Batch 5 contracts
        run: |
          node scripts/audit-succession-batch-5-timeline.mjs
          node scripts/audit-succession-timeline-atlas.mjs
          node scripts/audit-succession-batch-5-relationships.mjs
          node scripts/audit-succession-batch-5-black-whale.mjs
          node scripts/audit-succession-batch-5-assignments.mjs
          node scripts/audit-succession-batch-5-final.mjs

      - name: Explain scope
        if: always()
        run: echo 'This is a manual historical Batch 5 regression suite. It is not part of the homepage production release gate.' >> "$GITHUB_STEP_SUMMARY"
