name: Refresh Phase 3 lockfile

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'refactor/03-build-ci-efficiency' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Phase 3 branch
        uses: actions/checkout@v4
        with:
          ref: refactor/03-build-ci-efficiency

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify locked direct dependencies
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const root = lock.packages?.[''] || {};
          for (const field of ['dependencies', 'devDependencies']) {
            const expected = packageJson[field] || {};
            const actual = root[field] || {};
            for (const [name, version] of Object.entries(expected)) {
              if (actual[name] !== version) throw new Error(`${field}.${name} is ${actual[name]} instead of ${version}`);
            }
          }
          NODE

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json is already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Synchronize the pinned npm toolchain'
          git push origin HEAD:refactor/03-build-ci-efficiency
