name: Import Hunter x Hunter manga chapters

on:
  workflow_dispatch:
    inputs:
      start_chapter:
        description: First chapter to import
        required: true
        default: '339'
      end_chapter:
        description: Last chapter to import
        required: true
        default: '414'
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-hxh-manga.yml
      - scripts/import-hxh-chapters.mjs

permissions:
  contents: write

concurrency:
  group: hxh-manga-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Import chapter images
        env:
          START_CHAPTER: ${{ github.event.inputs.start_chapter || '339' }}
          END_CHAPTER: ${{ github.event.inputs.end_chapter || '414' }}
        run: node scripts/import-hxh-chapters.mjs

      - name: Commit imported chapter files
        run: |
          if git diff --quiet -- chapters/hunter-x-hunter; then
            echo "No chapter files changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chapters/hunter-x-hunter
          git commit -m "Import Hunter x Hunter chapters ${{ github.event.inputs.start_chapter || '339' }}-${{ github.event.inputs.end_chapter || '414' }}"
          git push
