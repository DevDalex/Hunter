name: Succession Accessibility Diagnostic

on:
  push:
    branches:
      - succession-visual-redesign-batch-5
  pull_request:
    branches:
      - succession-visual-redesign-batch-4
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Print exact accessibility targets
        run: node scripts/succession-a11y-diagnostic.mjs
