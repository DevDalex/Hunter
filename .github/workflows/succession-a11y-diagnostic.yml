name: Succession Accessibility Diagnostic

on:
  push:
    branches:
      - succession-visual-redesign-batch-5
  pull_request:
    branches:
      - succession-visual-redesign-batch-4
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare assets
        run: npm run prepare:eta-assets

      - name: Build production bundle
        run: npx vite build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Print exact accessibility targets
        run: node scripts/succession-a11y-diagnostic.mjs

      - name: Publish exact accessibility targets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: succession-a11y-diagnostic
          path: succession-a11y-diagnostic.json
          if-no-files-found: error
          retention-days: 7
