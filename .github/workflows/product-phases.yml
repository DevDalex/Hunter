name: Product phase completion

on:
  pull_request:
    paths:
      - 'src/components/succession/**'
      - 'src/data/succession/**'
      - 'src/data/schemas/**'
      - 'src/lib/succession/**'
      - 'src/lib/privacyAnalytics.js'
      - 'scripts/audit-product-phases.mjs'
      - '.github/workflows/product-phases.yml'
  push:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/audit-product-phases.mjs
      - run: npm run build
