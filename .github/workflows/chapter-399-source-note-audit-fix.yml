name: One-time Chapter 399 source-note audit fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chapter-399-source-note-audit-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out Chapter 399 audit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: scripts/audit-succession-chapter-399-boundary.mjs
          sparse-checkout-cone-mode: false

      - name: Normalize Markdown whitespace for Morena boundary assertion
        shell: python
        run: |
          from pathlib import Path
          path = Path('scripts/audit-succession-chapter-399-boundary.mjs')
          content = path.read_text()
          old = "assert(/exact room/i.test(note) && /does not.*Morena.*personally operates/i.test(note.replaceAll('**', '')), 'source note must preserve Morena exact-room/operator uncertainty');"
          new = "assert(/does not establish:.*Morena’s exact room.*Morena personally operates the Room 3101 teleport route.*Morena personally operates the self-restoring wall\\/stage/i.test(note.replaceAll('**', '').replace(/\\s+/g, ' ')), 'source note must preserve Morena exact-room/operator uncertainty');"
          if old not in content:
              raise SystemExit('Expected Chapter 399 Morena source-note assertion not found')
          path.write_text(content.replace(old, new, 1))

      - name: Commit source-note audit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/audit-succession-chapter-399-boundary.mjs
          git commit -m 'Normalize Chapter 399 Morena source-note audit'
          git push origin HEAD:main
