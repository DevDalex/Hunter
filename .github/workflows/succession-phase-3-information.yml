name: Succession Phase 3 Information Consistency

on:
  pull_request:
    paths:
      - 'src/data/succession/**'
      - 'src/components/succession/SuccessionArchiveShell.jsx'
      - 'src/components/succession/SuccessionInformationConsistencyPanel.jsx'
      - 'src/components/succession/SuccessionInformationConsistencyPanel.css'
      - 'scripts/audit-succession-phase-3-information-consistency.mjs'
      - 'scripts/audit-succession-phase-3-exception-states.mjs'
      - 'scripts/succession-phase-3-dossier-qa.mjs'
      - 'scripts/run-succession-runtime-audits.mjs'
      - '.github/workflows/succession-phase-3-information.yml'
  workflow_dispatch:

concurrency:
  group: succession-phase-3-information-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  phase-3-information-consistency:
    name: Phase 3 data and desktop dossier gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Phase 3 data audits
        run: |
          node scripts/audit-succession-phase-3-information-consistency.mjs
          node scripts/audit-succession-phase-3-exception-states.mjs

      - name: Build presentation runtime
        run: npm run build:runtime

      - name: Install Chromium
        run: npm exec playwright -- install --with-deps chromium

      - name: Inspect selected desktop dossiers
        run: node scripts/succession-phase-3-dossier-qa.mjs

      - name: Publish Phase 3 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: succession-phase-3-information-diagnostics
          path: .visual-qa/succession-phase-3-dossiers
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
