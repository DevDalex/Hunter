name: Succession Phase 3 Information Consistency

on:
  workflow_dispatch:

concurrency:
  group: succession-phase-3-information-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  phase-3-information-consistency:
    name: Legacy Phase 3 information consistency suite
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run preserved Phase 3 data audits
        run: |
          node scripts/audit-succession-phase-3-information-consistency.mjs
          node scripts/audit-succession-phase-3-exception-states.mjs

      - name: Explain scope
        if: always()
        run: echo 'This is a manual historical Phase 3 information suite. Retired dossier routes are not part of the homepage production release gate.' >> "$GITHUB_STEP_SUMMARY"
