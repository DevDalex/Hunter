name: One-time final Chapter 399 audit fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chapter-399-final-audit-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out Chapter 399 audit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: scripts/audit-succession-chapter-399-boundary.mjs
          sparse-checkout-cone-mode: false
      - name: Accept canonical knife-exhaustion phrasing
        shell: python
        run: |
          from pathlib import Path
          path = Path('scripts/audit-succession-chapter-399-boundary.mjs')
          content = path.read_text()
          old = "assert(/all.*kniv|knife.*exhaust/i.test(text(hinrigh399)), 'Hinrigh state must preserve knife exhaustion separately');"
          new = "assert(/all.*kniv|knife.*exhaust|exhaust.*knif/i.test(text(hinrigh399)), 'Hinrigh state must preserve knife exhaustion separately');"
          if old not in content:
              raise SystemExit('Expected Chapter 399 knife-exhaustion assertion not found')
          path.write_text(content.replace(old, new, 1))
      - name: Commit final Chapter 399 audit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/audit-succession-chapter-399-boundary.mjs
          git commit -m 'Accept Chapter 399 knife exhaustion phrasing'
          git push origin HEAD:main
