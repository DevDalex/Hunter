name: Repair workbench

on:
  push:
    branches:
      - fix/full-visual-backlog
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply staged repair
        id: repair
        if: github.event_name == 'push'
        shell: bash
        run: |
          if [ -d .repair/finalparts ]; then
            find .repair/finalparts -type f -name 'part-*' -print0 | sort -z | xargs -0 cat > /tmp/full-visual.patch
            git apply --check /tmp/full-visual.patch
            git apply /tmp/full-visual.patch
            rm -rf .repair
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Fix all reported visual and media issues"
            git push
            echo "applied=true" >> "$GITHUB_OUTPUT"
          else
            echo "applied=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.repair.outputs.applied != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.repair.outputs.applied != 'true'
        run: npm ci

      - name: Run production build and audits
        if: steps.repair.outputs.applied != 'true'
        run: npm run build
