name: Foundation Build Diagnostic

on:
  push:
    branches:
      - chimera-ant-retransform
    paths:
      - .github/workflows/foundation-build-diagnostic.yml
  pull_request:
    paths:
      - .github/workflows/foundation-build-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: chimera-ant-retransform

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Capture full build output
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee foundation-build.log
          echo "${PIPESTATUS[0]}" > foundation-build.status
          exit 0

      - name: Upload build diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-build-diagnostic-${{ github.sha }}
          path: |
            foundation-build.log
            foundation-build.status
          retention-days: 7

      - name: Enforce captured result
        run: exit "$(cat foundation-build.status)"
