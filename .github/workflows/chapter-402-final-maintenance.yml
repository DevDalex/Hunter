name: One-time Chapter 402 final maintenance

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add one-time Chapter 402 final maintenance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch Chapter 402 audit and lazy island
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:160]}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'scripts/audit-succession-chapter-402-boundary.mjs',
              "  assert(!(frozen401.successionMysteries || []).some((record) => /Luzurus.*Fugetsu|shoulder mark|martial/i.test(record.question || '')), 'Through401 mysteries must not backfill Chapter 402 questions');",
              "  const frozen401MysteryIds = new Set((frozen401.successionMysteries || []).map((record) => record.id).filter(Boolean));\n  const active402MysteryIds = new Set((dossier.successionMysteries || []).map((record) => record.id).filter(Boolean));\n  assert(chapterModule.succession402Mysteries.every((record) => !frozen401MysteryIds.has(record.id)), 'frozen through-401 dossier must not contain Chapter 402 mystery records');\n  assert(chapterModule.succession402Mysteries.every((record) => active402MysteryIds.has(record.id)), 'active through-402 dossier must expose every Chapter 402 mystery record');",
          )

          vite = Path('vite.config.js')
          text = vite.read_text()
          old = "(?:abilityFoundation402Expansion|eventFoundation402Expansion|relationshipFoundation402Expansion|locationFoundation402Expansion|organizationState402Corrections|characterState402Corrections|nenSystemFoundation402Corrections)"
          new = "(?:abilityFoundation402Expansion|eventFoundation402Expansion|relationshipFoundation402Expansion|locationFoundation402Expansion|organizationState402Corrections|organizationState402LegacySplits|characterState402Corrections|characterState402LegacySplits|guardianBeastState402LegacySplits|nenSystemFoundation402Corrections)"
          if text.count(old) != 1:
              raise SystemExit(f'vite.config.js: expected one Chapter 402 regex match, found {text.count(old)}')
          vite.write_text(text.replace(old, new, 1))
          PY

          git config user.name "DevDalex"
          git config user.email "58445340+DevDalex@users.noreply.github.com"
          git add scripts/audit-succession-chapter-402-boundary.mjs vite.config.js
          git diff --cached --check
          git commit -m "Finalize Chapter 402 audit and lazy island"
          git push origin HEAD:main
