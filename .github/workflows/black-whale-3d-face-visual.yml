name: Black Whale canonical face visual

on:
  pull_request:
    paths:
      - 'public/succession/black-whale-3d/**'
      - 'public/phase7/black-whale-3d-*'
      - 'public/black-whale-cutaway.png'
      - 'scripts/audit-black-whale-3d-exterior-refinement.mjs'
      - 'scripts/black-whale-3d-browser-qa.mjs'
      - '.github/workflows/black-whale-3d-face-visual.yml'
  push:
    branches: [main]
    paths:
      - 'public/succession/black-whale-3d/**'
      - 'public/phase7/black-whale-3d-*'
      - 'public/black-whale-cutaway.png'
      - 'scripts/audit-black-whale-3d-exterior-refinement.mjs'
      - 'scripts/black-whale-3d-browser-qa.mjs'
      - '.github/workflows/black-whale-3d-face-visual.yml'

permissions:
  contents: read

concurrency:
  group: black-whale-face-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical-face:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Sparse checkout Black Whale route
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /package-lock.json
            /public/phase7/**
            /public/succession/black-whale-3d/**
            /public/black-whale-cutaway.png
            /scripts/audit-black-whale-3d-exterior-refinement.mjs
            /scripts/black-whale-3d-browser-qa.mjs
            /.github/workflows/black-whale-3d-face-visual.yml
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npm exec playwright -- install --with-deps chromium
      - name: Audit canonical face contract
        run: node scripts/audit-black-whale-3d-exterior-refinement.mjs
      - name: Stage static Black Whale route
        run: |
          mkdir -p dist/client
          cp -R public/. dist/client/
      - name: Render and verify canonical face
        run: node scripts/black-whale-3d-browser-qa.mjs
      - name: Upload canonical face screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: black-whale-canonical-face-${{ github.sha }}
          path: .black-whale-3d-qa/
          if-no-files-found: warn
          retention-days: 14
