name: Retire narrow-width contracts

on:
  push:
    branches:
      - chimera-ant-retransform
    paths:
      - scripts/retire-narrow-width-contracts.py
      - .github/workflows/retire-narrow-width-contracts.yml

permissions:
  contents: write

concurrency:
  group: retire-narrow-width-contracts
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: chimera-ant-retransform
          fetch-depth: 0

      - name: Apply desktop-only contract
        run: python scripts/retire-narrow-width-contracts.py

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            node --check "$file"
          done < <(find scripts src/data -type f \( -name '*.mjs' -o -name '*.js' \) -print | sort)

      - name: Remove one-time migration files
        run: |
          rm scripts/retire-narrow-width-contracts.py
          rm .github/workflows/retire-narrow-width-contracts.yml

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Remove narrow-width release requirements"
          git pull --rebase origin chimera-ant-retransform
          git push origin HEAD:chimera-ant-retransform
