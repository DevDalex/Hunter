name: One-time dependency security repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dependency-security-fix.yml'
  workflow_dispatch:

concurrency:
  group: dependency-security-repair-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out dependency manifests only
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            package.json
            package-lock.json
          sparse-checkout-cone-mode: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install current dependencies
        run: npm ci

      - name: Apply safe transitive fixes
        shell: bash
        run: npm audit fix || true

      - name: Upgrade Wrangler to patched dependency line
        run: npm install --save-dev --save-exact wrangler@4.120.0

      - name: Verify no high-severity advisories remain
        run: npm audit --audit-level=high

      - name: Commit repaired dependency files
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'No dependency files changed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'Fix npm security advisories'
          git push origin HEAD:main
