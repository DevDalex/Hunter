name: Apply Batch 5 Inline Contrast Closure

on:
  pull_request:
    branches:
      - succession-visual-redesign-batch-4
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'succession-visual-redesign-batch-5'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: succession-visual-redesign-batch-5
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply deterministic inline contrast closure
        run: node scripts/apply-batch5-inline-contrast-closure.mjs

      - name: Commit deterministic inline contrast closure
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No inline contrast changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/SuccessionTimeline.jsx \
            src/components/BlackWhaleGuide.jsx \
            src/components/succession/SuccessionArchiveDeepWorkspaces.jsx \
            src/components/succession/SuccessionArchiveGuardianBeastWorkspace.jsx
          git commit -m "fix(batch5): enforce final accessible contrast tokens"
          git push origin HEAD:succession-visual-redesign-batch-5
