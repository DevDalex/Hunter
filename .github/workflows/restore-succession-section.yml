# Registered on main; this follow-up push triggers the restoration run.
name: Restore Succession section

on:
  push:
    paths:
      - .github/workflows/restore-succession-section.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: restore-succession-section
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current production branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore preserved Succession implementation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/succession-archive-shell
          git checkout origin/feat/succession-archive-shell -- \
            .github/workflows/import-chapter-batch.yml \
            .github/workflows/import-chapter-dispatch.yml \
            package.json \
            scripts/accessibility-qa.mjs \
            scripts/architecture-navigation-qa.mjs \
            scripts/audit-css.mjs \
            scripts/audit-hosted-chapter-admin.mjs \
            scripts/audit-performance.mjs \
            scripts/audit-succession-archive-data.mjs \
            scripts/audit-succession-archive-shell.mjs \
            scripts/audit-succession-chapter-media.mjs \
            scripts/audit-succession-reader.mjs \
            scripts/import-succession-chapter-url.mjs \
            scripts/import-succession-chapter.mjs \
            scripts/interaction-qa.mjs \
            scripts/run-succession-chapter-batch.mjs \
            scripts/succession-archive-shell-qa.mjs \
            scripts/succession-chapter-admin.mjs \
            scripts/succession-reader-enhancements-qa.mjs \
            scripts/succession-reader-qa.mjs \
            server/direct-chapter-import.js \
            src/App.jsx \
            src/components/ArchiveSearch.jsx \
            src/components/FamilyTree.jsx \
            src/components/SafeImage.jsx \
            src/components/SeriesWorkspace.jsx \
            src/components/StoryUtilities.css \
            src/components/SuccessionChapterReader.css \
            src/components/SuccessionChapterReader.jsx \
            src/components/SuccessionChapterReaderPolish.css \
            src/components/SuccessionReaderPerformance.css \
            src/components/succession-reader \
            src/components/succession \
            src/data/archiveMeta.js \
            src/data/contentIntegrity.js \
            src/data/routeManifest.js \
            src/data/succession \
            src/data/successionChapterAvailability.generated.js \
            src/data/successionChapterReader.js \
            src/data/successionReaderCatalog.js \
            src/lib/appRouter.js \
            src/lib/routePreload.js \
            src/styles/succession-archive.css

      - name: Preserve future chapter imports and Chapter 415 availability
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          targets = [
              Path('.github/workflows/import-chapter-batch.yml'),
              Path('.github/workflows/import-chapter-dispatch.yml'),
              Path('scripts/audit-succession-chapter-media.mjs'),
              Path('scripts/import-succession-chapter-url.mjs'),
              Path('scripts/import-succession-chapter.mjs'),
              Path('scripts/run-succession-chapter-batch.mjs'),
              Path('scripts/succession-chapter-admin.mjs'),
              Path('server/direct-chapter-import.js'),
          ]
          replacements = (
              ('chapter > 414', 'chapter > 9999'),
              ('chapterNumber > 414', 'chapterNumber > 9999'),
              ('chapter <= 414', 'chapter <= 9999'),
              ('chapterNumber <= 414', 'chapterNumber <= 9999'),
              ('MAX_CHAPTER = 414', 'MAX_CHAPTER = 9999'),
              ('READER_END = 414', 'READER_END = 9999'),
              ('through 414', 'through 9999'),
              ('338–414', '338–9999'),
              ('338-414', '338-9999'),
          )
          for path in targets:
              text = path.read_text()
              for old, new in replacements:
                  text = text.replace(old, new)
              path.write_text(text)
          PY

          cat > src/data/successionChapterAvailability.generated.js <<'EOF'
          // Generated by the Succession chapter import tools.
          // Do not edit chapter availability manually; re-run an importer instead.
          export const authorizedSuccessionChapterNumbers = Object.freeze(Array.from({ length: 78 }, (_, index) => 338 + index));
          export const LATEST_AUTHORIZED_SUCCESSION_CHAPTER = 415;
          EOF

      - name: Install and verify production build
        run: |
          npm ci
          npm run build

      - name: Commit restored Succession section
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/restore-succession-section.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore redesigned Succession section"
          git push origin HEAD:main
