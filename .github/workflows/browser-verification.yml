name: Browser Verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: browser-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-qa:
    name: Browser-rendered QA
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npm exec playwright -- install --with-deps chromium

      - name: Build runtime
        run: npm run generate:build-info && npm run build:runtime

      - name: Verify Black Whale 3D route after full render
        run: node scripts/black-whale-3d-browser-qa.mjs

      - name: Run full browser verification
        shell: bash
        env:
          VISUAL_QA_SCREENSHOTS: failures
        run: |
          set -o pipefail
          mkdir -p .browser-qa
          set +e
          npm run qa:browser:verify 2>&1 | tee .browser-qa/console.log
          qa_status=${PIPESTATUS[0]}
          set -e
          if (( qa_status != 0 )); then
            node scripts/validate-browser-qa-result.mjs
          fi

      - name: Upload browser QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa-${{ github.sha }}
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
          path: |
            .browser-qa/
            .search-qa/
            .visual-qa/
            .accessibility-qa/
            .interaction-qa/
            .performance-qa/
            .black-whale-3d-qa/
