name: Succession Visual Redesign

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: succession-visual-redesign-${{ github.ref }}
  cancel-in-progress: true

jobs:
  legacy-regression:
    name: Legacy Succession redesign regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run preserved visual-redesign contracts
        run: |
          npm run audit:succession-visual-foundation
          npm run audit:succession-shell-redesign
          npm run audit:succession-page-header-redesign
          npm run audit:succession-breadcrumb-redesign
          npm run audit:succession-batch-2
          npm run audit:succession-character-command
          npm run audit:succession-royal-command
          npm run audit:succession-batch-3

      - name: Explain scope
        if: always()
        run: echo 'This is a manual historical regression suite. It is not part of the homepage production release gate.' >> "$GITHUB_STEP_SUMMARY"
