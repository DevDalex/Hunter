name: Succession Visual Redesign

on:
  push:
    branches:
      - succession-visual-redesign-batch-1
  pull_request:
    paths:
      - 'src/components/succession/**'
      - 'src/data/succession/**'
      - 'scripts/audit-succession-visual-foundation.mjs'
      - 'scripts/report-succession-visual-inventory.mjs'
      - 'docs/SUCCESSION-VISUAL-REDESIGN.md'
      - 'package.json'
      - '.github/workflows/succession-visual-redesign.yml'

permissions:
  contents: read

concurrency:
  group: succession-visual-redesign-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline_runtime:
    name: Main runtime baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      runtime_outcome: ${{ steps.baseline_runtime.outcome }}

    steps:
      - name: Check out main baseline
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture main Succession runtime
        id: baseline_runtime
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run audit:succession-runtime 2>&1 | tee succession-runtime-main.log

      - name: Publish main runtime baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: succession-runtime-main-baseline
          path: succession-runtime-main.log
          if-no-files-found: error
          retention-days: 14

      - name: Summarize main runtime state
        if: always()
        run: |
          echo "Main runtime outcome: ${{ steps.baseline_runtime.outcome }}" >> "$GITHUB_STEP_SUMMARY"

  foundation:
    name: Foundation and visual regression audits
    needs: baseline_runtime
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit visual foundation
        run: npm run audit:succession-visual-foundation

      - name: Report visual inventory
        run: npm run report:succession-visual-inventory > succession-visual-inventory.md

      - name: Audit CSS ownership
        run: npm run audit:css

      - name: Audit readability
        run: npm run audit:readability

      - name: Audit accessibility contracts
        run: npm run audit:accessibility

      - name: Audit Succession runtime
        id: succession_runtime
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run audit:succession-runtime 2>&1 | tee succession-runtime.log

      - name: Build presentation bundle
        run: |
          npm run prepare:eta-assets
          npx vite build

      - name: Install Chromium for visual QA
        shell: bash
        run: |
          npx playwright install --with-deps chromium
          echo "CHROMIUM_PATH=$(node -e "import('playwright').then(({ chromium }) => console.log(chromium.executablePath()))")" >> "$GITHUB_ENV"

      - name: Inspect Story workspace at all viewports
        env:
          VISUAL_QA_ROUTE: succession/story
          VISUAL_QA_OUTPUT: .visual-qa/succession-story
          VISUAL_QA_SCREENSHOTS: all
        run: npm run qa:visual

      - name: Inspect Timeline workspace at all viewports
        env:
          VISUAL_QA_ROUTE: succession/timeline
          VISUAL_QA_OUTPUT: .visual-qa/succession-timeline
          VISUAL_QA_SCREENSHOTS: all
        run: npm run qa:visual

      - name: Inspect Character workspace at all viewports
        env:
          VISUAL_QA_ROUTE: succession/characters
          VISUAL_QA_OUTPUT: .visual-qa/succession-characters
          VISUAL_QA_SCREENSHOTS: all
        run: npm run qa:visual

      - name: Inspect Black Whale workspace at all viewports
        env:
          VISUAL_QA_ROUTE: succession/black-whale
          VISUAL_QA_OUTPUT: .visual-qa/succession-black-whale
          VISUAL_QA_SCREENSHOTS: all
        run: npm run qa:visual

      - name: Inspect Nen workspace at all viewports
        env:
          VISUAL_QA_ROUTE: succession/nen
          VISUAL_QA_OUTPUT: .visual-qa/succession-nen
          VISUAL_QA_SCREENSHOTS: all
        run: npm run qa:visual

      - name: Inspect Research workspace at all viewports
        env:
          VISUAL_QA_ROUTE: succession/research
          VISUAL_QA_OUTPUT: .visual-qa/succession-research
          VISUAL_QA_SCREENSHOTS: all
        run: npm run qa:visual

      - name: Publish visual and runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: succession-visual-redesign-diagnostics
          path: |
            succession-runtime.log
            succession-visual-inventory.md
            .visual-qa
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Record inherited runtime debt
        if: steps.succession_runtime.outcome == 'failure' && needs.baseline_runtime.outputs.runtime_outcome == 'failure'
        run: |
          echo 'The branch and main runtime sweeps both fail. The visual gate treats this as inherited baseline debt, not a redesign regression.' >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce branch-only runtime regressions
        if: steps.succession_runtime.outcome == 'failure' && needs.baseline_runtime.outputs.runtime_outcome == 'success'
        run: |
          echo 'The Succession runtime passes on main but fails on this branch.'
          exit 1
