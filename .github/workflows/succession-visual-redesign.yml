name: Succession Visual Redesign

on:
  push:
    branches:
      - succession-visual-redesign-batch-1
  pull_request:
    paths:
      - 'src/components/succession/**'
      - 'src/data/succession/**'
      - 'scripts/audit-succession-visual-foundation.mjs'
      - 'scripts/report-succession-visual-inventory.mjs'
      - 'docs/SUCCESSION-VISUAL-REDESIGN.md'
      - 'package.json'
      - '.github/workflows/succession-visual-redesign.yml'

permissions:
  contents: read

concurrency:
  group: succession-visual-redesign-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline-runtime:
    name: Main runtime baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out main baseline
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture main Succession runtime
        id: baseline-runtime
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run audit:succession-runtime 2>&1 | tee succession-runtime-main.log

      - name: Publish main runtime baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: succession-runtime-main-baseline
          path: succession-runtime-main.log
          if-no-files-found: error
          retention-days: 14

      - name: Summarize main runtime state
        if: always()
        run: echo "Main runtime outcome: ${{ steps.baseline-runtime.outcome }}" >> "$GITHUB_STEP_SUMMARY"

  foundation:
    name: Foundation and regression audits
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit visual foundation
        run: npm run audit:succession-visual-foundation

      - name: Report visual inventory
        run: npm run report:succession-visual-inventory > succession-visual-inventory.md

      - name: Audit CSS ownership
        run: npm run audit:css

      - name: Audit readability
        run: npm run audit:readability

      - name: Audit accessibility contracts
        run: npm run audit:accessibility

      - name: Audit Succession runtime
        id: succession-runtime
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run audit:succession-runtime 2>&1 | tee succession-runtime.log

      - name: Publish diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: succession-visual-redesign-diagnostics
          path: |
            succession-runtime.log
            succession-visual-inventory.md
          if-no-files-found: error
          retention-days: 14

      - name: Build production release
        if: steps.succession-runtime.outcome == 'success'
        run: npm run build

      - name: Enforce Succession runtime result
        if: steps.succession-runtime.outcome == 'failure'
        run: |
          echo 'Succession runtime regression detected. Compare the branch diagnostic artifact with the main runtime baseline.'
          exit 1
