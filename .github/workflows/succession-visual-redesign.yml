name: Succession Visual Redesign

on:
  push:
    branches:
      - succession-visual-redesign-batch-1
  pull_request:
    paths:
      - 'src/components/succession/**'
      - 'src/data/succession/**'
      - 'scripts/audit-succession-visual-foundation.mjs'
      - 'docs/SUCCESSION-VISUAL-REDESIGN.md'
      - 'package.json'
      - '.github/workflows/succession-visual-redesign.yml'

permissions:
  contents: read

concurrency:
  group: succession-visual-redesign-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Foundation and regression audits
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit visual foundation
        run: npm run audit:succession-visual-foundation

      - name: Audit CSS ownership
        run: npm run audit:css

      - name: Audit readability
        run: npm run audit:readability

      - name: Audit accessibility contracts
        run: npm run audit:accessibility

      - name: Audit Succession runtime
        run: npm run audit:succession-runtime

      - name: Build production release
        run: npm run build
