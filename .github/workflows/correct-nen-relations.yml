name: Correct Nen relation map

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/correct-nen-relations.yml

permissions:
  contents: write

jobs:
  correct-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Correct relation data and rendering
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/NenEncyclopedia.jsx')
          source = path.read_text()

          replacements = [
            (
              "{ name: 'Ryu', bases: ['Ten', 'Ren'], base: 'Gyo + Ken', detail:",
              "{ name: 'Ryu', bases: [], defaultPrinciple: 'Ren', base: 'Gyo + Ken', detail:"
            ),
            (
              "];\n\nconst anatomy = [",
              "];\n\nconst principlePoints = {\n  Ten: [50, 21],\n  Zetsu: [79, 50],\n  Ren: [50, 79],\n  Hatsu: [21, 50],\n};\n\nconst techniquePoints = {\n  Gyo: [21, 9],\n  In: [79, 9],\n  En: [92, 35],\n  Shu: [86, 76],\n  Ko: [50, 91],\n  Ken: [14, 76],\n  Ryu: [8, 35],\n};\n\nconst anatomy = ["
            ),
            (
              "  const principle = principles.find((item) => item.name === activePrinciple) || principles[0];\n  const related = techniques.filter((item) => item.bases.includes(activePrinciple));\n  const technique = techniques.find((item) => item.name === activeTechnique && item.bases.includes(activePrinciple)) || related[0];\n  const choosePrinciple = (name) => {\n    setActivePrinciple(name);\n    setActiveTechnique(techniques.find((item) => item.bases.includes(name))?.name || 'Gyo');\n  };\n",
              "  const principle = principles.find((item) => item.name === activePrinciple) || principles[0];\n  const related = techniques.filter((item) => item.bases.includes(activePrinciple));\n  const technique = techniques.find((item) => item.name === activeTechnique) || related[0];\n  const isChainedTechnique = Boolean(technique && technique.bases.length === 0);\n  const [originX, originY] = principlePoints[activePrinciple] || principlePoints.Ten;\n  const choosePrinciple = (name) => {\n    setActivePrinciple(name);\n    setActiveTechnique(techniques.find((item) => item.bases.includes(name))?.name || 'Gyo');\n  };\n  const chooseTechnique = (item) => {\n    const nextPrinciple = item.bases.includes(activePrinciple)\n      ? activePrinciple\n      : (item.bases[0] || item.defaultPrinciple);\n    if (nextPrinciple) setActivePrinciple(nextPrinciple);\n    setActiveTechnique(item.name);\n  };\n"
            ),
            (
              "The bright outer nodes are the techniques that depend on the selected foundation. A technique can light up from more than one principle because Nen applications combine rules.",
              "The highlighted lines show direct derivations from the selected principle. Chained applications such as Ryu are labeled separately instead of being falsely attached to a basic principle."
            ),
            (
              "        <i className=\"nen-principle-map__ring\" aria-hidden=\"true\" />\n        <div className=\"nen-principle-map__center\"><span>念</span><small>Nen</small></div>",
              "        <i className=\"nen-principle-map__ring\" aria-hidden=\"true\" />\n        <svg className=\"nen-principle-links\" viewBox=\"0 0 100 100\" preserveAspectRatio=\"none\" aria-hidden=\"true\">\n          {related.map((item) => {\n            const [targetX, targetY] = techniquePoints[item.name];\n            return <line x1={originX} y1={originY} x2={targetX} y2={targetY} key={`${activePrinciple}-${item.name}`} />;\n          })}\n        </svg>\n        <div className=\"nen-principle-map__center\"><span>念</span><small>Nen</small></div>"
            ),
            (
              "        {techniques.map((item) => {\n          const connected = item.bases.includes(activePrinciple);\n          return <button\n            type=\"button\"\n            className={`nen-advanced-node is-${item.position}${connected ? ' is-related' : ''}${technique?.name === item.name ? ' is-active' : ''}`}\n            aria-label={`${item.name}: ${item.base}`}\n            onMouseEnter={() => connected && setActiveTechnique(item.name)}\n            onFocus={() => connected && setActiveTechnique(item.name)}\n            onClick={() => { setActiveTechnique(item.name); if (!connected) choosePrinciple(item.bases[0]); }}\n            key={item.name}\n          ><strong>{item.name}</strong><small>{item.base}</small></button>;\n        })}",
              "        {techniques.map((item) => {\n          const connected = item.bases.includes(activePrinciple);\n          const chained = item.bases.length === 0;\n          return <button\n            type=\"button\"\n            className={`nen-advanced-node is-${item.position}${connected ? ' is-related' : ''}${chained ? ' is-chained' : ''}${technique?.name === item.name ? ' is-active' : ''}`}\n            aria-label={`${item.name}: ${item.base}${chained ? '; chained technique, not a direct Four Major Principle application' : ''}`}\n            onMouseEnter={() => chooseTechnique(item)}\n            onFocus={() => chooseTechnique(item)}\n            onClick={() => chooseTechnique(item)}\n            key={item.name}\n          ><strong>{item.name}</strong><small>{item.base}</small></button>;\n        })}"
            ),
            (
              "          <header><span>{related.length} dependent application{related.length === 1 ? '' : 's'}</span><strong>{technique?.name}</strong></header>",
              "          <header><span>{isChainedTechnique ? 'Chained advanced application' : `${related.length} direct application${related.length === 1 ? '' : 's'}`}</span><strong>{technique?.name}</strong></header>"
            ),
            (
              "          <p>{technique?.detail}</p>\n          <div>{related.map",
              "          <p>{technique?.detail}</p>\n          {isChainedTechnique && <small className=\"nen-principle-inspector__chain\">Ryu is Gyo used while maintaining Ken. It is therefore shown as a second-stage technique, not as a direct branch of Ten or Ren.</small>}\n          <div>{related.map"
            ),
          ]

          for old, new in replacements:
            if old not in source:
              raise SystemExit(f'Expected source block not found: {old[:90]}')
            source = source.replace(old, new, 1)

          path.write_text(source)
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify production build
        run: |
          npm ci
          npm run build

      - name: Commit verified correction
        shell: bash
        run: |
          rm .github/workflows/correct-nen-relations.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/NenEncyclopedia.jsx src/nen-diagram-redesign.css .github/workflows/correct-nen-relations.yml
          git commit -m "Correct Nen principle dependency mapping"
          git push
