name: Foundation dependency placement

on:
  push:
    branches:
      - chimera-ant-retransform
    paths:
      - .github/workflows/foundation-dependency-placement.yml
  pull_request:
    paths:
      - .github/workflows/foundation-dependency-placement.yml

permissions:
  contents: write

jobs:
  place:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: chimera-ant-retransform
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Align build and browser dependencies
        run: |
          npm install --save-dev --save-exact sharp
          npm install --save-dev --save-exact playwright@1.62.0

      - name: Commit synchronized dependency files
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Align Playwright foundation versions"
          git pull --rebase origin chimera-ant-retransform
          git push origin HEAD:chimera-ant-retransform
