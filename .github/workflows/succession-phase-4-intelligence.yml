name: Succession Phase 4 High-Value Intelligence

on:
  workflow_dispatch:

concurrency:
  group: succession-phase-4-intelligence-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  phase-4-high-value-intelligence:
    name: Legacy Phase 4 intelligence consistency suite
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run preserved Phase 4 intelligence audit
        run: node scripts/audit-succession-phase-4-high-value-intelligence.mjs

      - name: Explain scope
        if: always()
        run: echo 'This is a manual historical Phase 4 intelligence suite. Retired workbench routes are not part of the homepage production release gate.' >> "$GITHUB_STEP_SUMMARY"
