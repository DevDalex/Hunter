name: Succession Phase 4 High-Value Intelligence

on:
  pull_request:
    paths:
      - 'src/data/succession/**'
      - 'src/components/succession/SuccessionArchiveApp.jsx'
      - 'src/components/succession/SuccessionArchivePrimitives.jsx'
      - 'src/components/succession/SuccessionIntelligenceWorkbench.jsx'
      - 'src/components/succession/SuccessionIntelligenceWorkbench.css'
      - 'scripts/audit-succession-phase-4-high-value-intelligence.mjs'
      - 'scripts/succession-phase-4-intelligence-qa.mjs'
      - 'scripts/run-succession-runtime-audits.mjs'
      - '.github/workflows/succession-phase-4-intelligence.yml'
  workflow_dispatch:

concurrency:
  group: succession-phase-4-intelligence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  phase-4-high-value-intelligence:
    name: Phase 4 data and desktop workbench gate
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Phase 4 intelligence audit
        run: node scripts/audit-succession-phase-4-high-value-intelligence.mjs

      - name: Build presentation runtime
        run: npm run build:runtime

      - name: Install Chromium
        run: npm exec playwright -- install --with-deps chromium

      - name: Inspect desktop intelligence workbench
        run: node scripts/succession-phase-4-intelligence-qa.mjs

      - name: Publish Phase 4 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: succession-phase-4-intelligence-diagnostics
          path: .visual-qa/succession-phase-4-intelligence
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
