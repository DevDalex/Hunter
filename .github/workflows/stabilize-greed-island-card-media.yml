name: Stabilize Greed Island Card Media

on:
  push:
    branches:
      - feature/greed-island-binder-foundation
    paths:
      - scripts/stabilize-greed-island-card-media.mjs
      - scripts/stabilize-greed-island-library-media.mjs
      - src/data/greed-island/specifiedCardMedia.js
      - src/data/greed-island/specifiedCardLocalMedia.generated.js
      - src/data/greed-island/cardLibraryMedia.js
      - src/data/greed-island/cardLibraryLocalMedia.generated.js
      - .github/workflows/stabilize-greed-island-card-media.yml

permissions:
  contents: write

concurrency:
  group: greed-island-card-media-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stabilize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Stabilize all Specified Slot scans
        run: node scripts/stabilize-greed-island-card-media.mjs

      - name: Verify Specified Slot media
        run: node scripts/stabilize-greed-island-card-media.mjs --verify-only

      - name: Stabilize Spell, Free Slot, and Game Master scans
        run: node scripts/stabilize-greed-island-library-media.mjs

      - name: Verify card library media
        run: node scripts/stabilize-greed-island-library-media.mjs --verify-only

      - name: Commit generated WebPs and manifests
        run: |
          if git diff --quiet -- public/media/greed-island/cards public/media/greed-island/library-cards src/data/greed-island/specifiedCardLocalMedia.generated.js src/data/greed-island/cardLibraryLocalMedia.generated.js; then
            echo "Generated media is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/greed-island/cards public/media/greed-island/library-cards src/data/greed-island/specifiedCardLocalMedia.generated.js src/data/greed-island/cardLibraryLocalMedia.generated.js
          git commit -m "Stabilize Greed Island card WebPs"
          git push origin HEAD:${GITHUB_REF_NAME}
